<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Extract URLs from Text</title>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
		<script>
			$(document).ready(function() {
				$("#input").on( "change", function() {
					//const regexp = /http[s]?:\/\/[\w./?=%&-]*/g;
					const regexp = /https?:\/\/(?:www\.)?[a-zA-Z0-9-]+(?:\.[a-zA-Z]{2,})+(?:\/[^\s]*)?/g;
					let urls = $(this).val().match(regexp);
					
					const output = $("#output");
					output.html("");
					for ( let i = 0; i < urls.length; i++ ) {
						output.append( "<li><a href='"+urls[i]+"' target='_blank' rel='noreferrer noopenner'>"+urls[i]+"</a></li>" );
					}
				} );
			} );
		</script>

		<style type="text/css">
			body {
				font-family: Arial, sans-serif;
				margin: 20px;
				line-height: 1.6;
			}
			h1 {
				color: #333;
			}
			textarea#input {
				width: 100%;
				max-width: 95%;
				padding: 10px;
				border: 1px solid #ccc;
				border-radius: 5px;
				box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
			}
			div#output {
				margin-top: 20px;
				padding: 10px;
				border: 1px solid #ddd;
				border-radius: 5px;
				background-color: #f9f9f9;
				max-width: 95%;
			}
			div#output ul {
				list-style-type: none;
				padding: 0;
				margin: 0;
			}
		</style>
	</head>

	<body>
		<h1>Extract URLs from Text</h1>
		<textarea id="input" rows="4" placeholder="Please input your Text here..."></textarea>
		<div id="output">
			<ul></ul>
		</div>
	</body>
</html>
